<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>WebGPU + WASM</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- WebGPU / WASM entry -->
  <script type="module" src="./main.ts"></script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap");

    body {
      padding: 0;
      margin: auto;
      height: max-content;
      width: min-content;
      font-family: "Coming Soon";
      font-size: 2.5em;
    }

    input {
      display: inline;
      font-size: inherit;
      padding: 0.5em;
      margin: 0.5em;
      border-radius: 1rem;
      font-family: inherit;
    }

    canvas {
      box-sizing: content-box;
      display: block;
      width: 100%;
      height: 100%;
    }

    #DialogChoices {
      font-size: 0.6em;
      overflow-y: auto;
    }

    #DialogChoices button {
      padding: 0.5em 0.75em;
      /*background-color: black;*/
      flex: 1;
      border-radius: 0.5rem;
      text-align: left;
      transition: background 0.15s ease;
      background-color: white;
      min-height: 60px;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #DialogChoices button:hover {
      background-color: #afacac;
    }

    #CharacterTalk {
      font-size: 0.9em;
      line-height: 1.3;
    }

    #ConversationContainer {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
    }

    #ConversationContainer::-webkit-scrollbar {
      width: 8px;
    }

    #ConversationContainer::-webkit-scrollbar-track {
      background: transparent;
    }

    #ConversationContainer::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    #ConversationContainer::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }

    .dialog-bubble {
      font-size: 0.9em;
      line-height: 1.3;
    }

    .dialog-bubble-character {
      align-self: flex-start;
    }

    .dialog-bubble-player {
      align-self: flex-end;
    }

    .fa-input {
      font-family: "Font Awesome 5 Free", "Helvetica", sans-serif;
      font-weight: 900;
    }

    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .top-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #fullscreen {
      height: 1.8em;
      width: 1.8em;
      aspect-ratio: 1;
      cursor: pointer;
      font-size: 0.9em;
      border-radius: 0.4rem;
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    #fullscreen:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    #mute-button {
      height: 1.8em;
      width: 1.8em;
      aspect-ratio: 1;
      cursor: pointer;
      font-size: 0.9em;
      border-radius: 0.4rem;
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    #mute-button:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    .audio-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }

    .audio-button {
      padding: 0.3em 0.5em;
      border-radius: 0.4rem;
      text-align: left;
      transition: background 0.15s ease;
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
      cursor: pointer;
      font-size: 0.5em;
      white-space: nowrap;
    }

    .audio-button:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    #interact-prompt {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 0.5em 1em;
      border-radius: 0.5rem;
      font-size: 0.6em;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    #interact-prompt.show {
      display: block;
    }
  </style>
</head>

<body>
  <div style="position: relative; height: 1080px; width: 1920px">
    <dialog id="modal" style="display: none; /* close modal by default**/"
      class="absolute w-[1920px] h-[1080px] flex flex-col justify-center items-center bg-transparent">
      <!-- MAIN DIALOG CONTAINER -->
      <div class="flex flex-col w-[100%] h-[100%] bg-black/30 rounded-md text-black p-8 shadow-lg">
        <div class="flex w-full gap-6 rounded-md text-white">
          <!-- LEFT: CHARACTER -->
          <div class="h-[700px] w-[968px] overflow-hidden">

            <img src="./assets/sprites/characterPortraits/characters.portraits/noble-lady.PNG" id="CharacterImage"
              class="relative items-end justify-start  object-cover  w-full pointer-events-none"
              style="pointer-events: none;" />
          </div>
          <!-- RIGHT: DIALOG + OPTIONS -->
          <div class="h-full w-[50%] flex flex-col items-end justify-end gap-4">
            <!-- Scrollable conversation container -->
            <div id="ConversationContainer" class="flex flex-col gap-4 w-full overflow-y-auto flex-1 pr-2"
              style="max-height: 600px;">
              <!-- Dialog bubbles will be dynamically added here -->
            </div>

            <!-- Choices -->
          </div>
        </div>
        <div id="DialogChoices" class="flex flex-1 grid grid-cols-2 gap-2">
          <!-- Choice buttons injected here -->
        </div>
      </div>
    </dialog>

    <canvas width="1920" height="1080"></canvas>
  </div>

  <!-- CONTROLS -->
  <div id="controls">
    <div class="top-controls">
      <input type="button" id="fullscreen" class="fa-input" value="&#xf065;" />
      <button id="mute-button" class="fa-input" aria-label="Mute/Unmute">&#xf028;</button>
    </div>
    <div class="audio-controls">
      <button class="audio-button" data-index="0">Aquatic Pulsations</button>
      <button class="audio-button" data-index="1">Background</button>
      <button class="audio-button" data-index="2">Borderlands</button>
    </div>
  </div>

  <!-- INTERACT PROMPT -->
  <div id="interact-prompt">Press E to interact</div>
</body>

</html>
