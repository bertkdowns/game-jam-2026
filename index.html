<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebGPU + WASM </title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">  

    <!-- font awesome for icons --> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- imports the wasm and sets up the canvas to display webgpu-->
    <script type="module" src="/main.ts"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
        body { padding: 0; margin: auto; height: max-content; width: min-content; font-family: "Outfit"; font-size: 2.5em;}
        input {display: inline; font-size: inherit; padding: 0.5em; margin: 0.5em;  border-radius: 1rem;  font-family: inherit;}
        canvas {box-sizing: content-box; }
        .fa-input { font-family: 'Font Awesome 5 Free', 'Helvetica', sans-serif;  font-weight: 900; }
        #fullscreen {float:right;  height: 2.5em; aspect-ratio : 1;}
        form {padding: 0; margin: auto 0.5em auto 0.5em ; width: max-content; float: left;}
    </style>
</head>

<body>
    
    <div style="position: relative; height:1080px;width:1920px" id="modal">
        <div  style="position:absolute;border: 3px solid yellow; width:1920px; height:1080px;">
            <div class="flex justify-center items-center border border-green h-full">


            </div>
        </div>
        
    <canvas width="1920" height="1080"></canvas>
    </div>

    <span id="controls"> 
    <input type="text" id="text">
    <input type="button" id="to3D" value="3D control">
    <input type="button" id="to2D" value="2D control">
    <input type="button" id="fullscreen" class="fa-input" value="&#xf065;" >
    <!--canvas width="512" height="512"></canvas-->
    </span> 
   


    <script type="module">
        import {Disable2DMouse, Enable2DMouse, EnableCanvasLock, DisableCanvasLock} from "./assets/engine_core/input.js";
        // #region Input Elements 
        document.getElementById("to2D").addEventListener("click", (e) => {
            DisableCanvasLock();
            Enable2DMouse();
        });
        document.getElementById("to3D").addEventListener("click", (e) => {
            Disable2DMouse();
            EnableCanvasLock();
        });
        document.getElementById("fullscreen").addEventListener("click", (e) => {
        
            const el = document.querySelector("canvas");
            if (el.requestFullscreen) {
                el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) { /* Safari */
                el.webkitRequestFullscreen();
            } else if (el.msRequestFullscreen) { /* IE11 */
                el.msRequestFullscreen();
            }
        });
        //#endregion
        console.log("added external 'inputs'");
    </script>
</body>
</html>
